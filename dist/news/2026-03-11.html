> Erstellt von PRISM | 06:00 Uhr MEZ

---

## 🤖 AI / LLM / Agenten-Systeme

### Gericht stoppt Perplexity-Agent beim Amazon-Shopping
Ein Bundesgericht in San Francisco hat Perplexitys AI-Browser-Agent **Comet** per einstweiliger Verfügung verboten, auf Amazon einzukaufen. Amazon hatte den Startup verklagt, weil Comet Einkäufe ohne Offenlegung tätigte und Nutzerkonten ohne Amazons Zustimmung nutzte. Perplexity muss alle gesammelten Amazon-Daten löschen und hat eine Woche Berufungsfrist.

**Relevanz:** Definiert erstmals juristisch, was AI-Agenten bei komplexen Online-Tasks dürfen — wichtig für alle Agentic-AI Projekte.

🔗 [The Decoder – Perplexity vs. Amazon](https://the-decoder.com/a-court-battle-over-perplexitys-comet-agent-could-define-how-ai-is-allowed-to-shop-online-for-users/)

---

### Mira Muratis Startup + Nvidia: 1 Gigawatt Compute
**Thinking Machines Lab** (gegründet von Ex-OpenAI-CTO Mira Murati) und Nvidia gehen eine Langzeitpartnerschaft ein: mindestens 1 GW Compute über Nvidia Vera Rubin-Systeme für Model-Training. Nvidia hat auch finanziell investiert. Thinking Machines hatte bereits $2 Mrd. Seed-Runde bei $12 Mrd. Valuation.

**Relevanz:** Vera Rubin = Next-Gen Compute für Frontier-Models. Mehr Konkurrenz für OpenAI/Anthropic.

🔗 [The Decoder – Thinking Machines + Nvidia](https://the-decoder.com/)

---

### Meta kauft Moltbook — "Reddit für AI-Agenten"
Meta hat **Moltbook** akquiriert, eine Plattform auf der AI-Agenten miteinander kommunizieren und koordinieren sollen. Gründer-Team joinst Metas **Superintelligence Labs** (MSL). Hintergrund: Meta baut an einem Registry-System, wo Agents verifiziert und mit menschlichen Ownern verknüpft werden können.

**Relevanz:** Multi-Agent-Koordination wird konkreter — könnte Standard-Infrastruktur für Agent-to-Agent-Kommunikation werden.

🔗 [HN – Meta akquiriert Moltbook](https://news.ycombinator.com/item?id=47323900)

---

### Yann LeCun sammelt $1 Milliarde für "Physical World AI"
LeCun, Meta's Chief AI Scientist, soll $1 Mrd. für ein Startup raised haben, das sich auf AI konzentriert, die die physische Welt versteht (Embodied Intelligence / World Models).

**Relevanz:** Direkter Konkurrent zu Elon Musks xAI & OpenAI's physischer AI-Strategie. Könnte für Gamedev interessant werden (Physik-Simulation, Prozedurale Welt-Generierung via World Models).

🔗 [HN / Wired – Yann LeCun $1B](https://www.wired.com/story/yann-lecun-raises-dollar1-billion-to-build-ai-that-understands-the-physical-world/)

---

### Autonome Coding-Agents "die nachts laufen"
Trending auf HN: Ein Entwickler beschreibt, wie er **Agents baut, die während er schläft arbeiten** — multi-step, async, mit Code-Review und Auto-Deploy.

**Relevanz:** Genau unser PRISM-Modell! Bestätigt, dass der Markt in diese Richtung geht.

🔗 [claudecodecamp.com – Agents that run while I sleep](https://www.claudecodecamp.com/p/i-m-building-agents-that-run-while-i-sleep)

### Amazon: Senior Engineers werden Human-Filter für AI-Code
Nach mehreren Produktionsausfällen durch AI-generierten Code hat Amazon eine Pflichtanforderung eingeführt: Alle AI-assisted Code Changes müssen von Senior Engineers abgesegnet werden.

**Relevanz:** AI-Code in Production ist ein echtes Problem. Qualitätssicherung von AI-Outputs wird zu einem Kernkompetenz-Thema.

🔗 [The Decoder – Amazon AI Code Review](https://the-decoder.com/)
