## 🤖 AI / LLM / Agenten-Systeme

### 🔥 AI-Agent-Boom: China fördert "Ein-Personen-Firmen" mit AI-Mitarbeitern
Sieben chinesische Lokalbehörden haben innerhalb weniger Tage Förderprogramme für AI-Agent-Ökosysteme aufgelegt. Hefei, Shenzhen, Wuxi, Changshu und Changzhou bieten je **$700K–$1.4M** in Subventionen für Startups, die mit AI Agents als "Mitarbeitern" arbeiten. Das Konzept der "Ein-Personen-Firma" mit AI-Workforce wird aktiv gefördert. Für AI-First Gamedev genau das richtige Framing.
- 📎 [SCMP Report](https://www.scmp.com/tech/tech-trends/article/3346513/inside-openclaw-mania-gripping-china-security-fears-surge-alongside-enthusiasm)

### 🎤 Hume AI TADA: Open-Source TTS, 5x schneller, zero Hallucinations
Hume AI hat **TADA** open-sourced — ein TTS-System das Text und Audio synchron verarbeitet. Besonderheit: 1 Audio-Token pro Text-Token (statt Explosion), dadurch **5x schneller** als vergleichbare Systeme und **0 Transkriptions-Halluzinationen** bei 1000+ Tests. Läuft auf Smartphones. 1B (EN) und 3B (8 Sprachen) Versionen, beide Llama-basiert, MIT License.
- 📎 [GitHub](https://github.com/HumeAI/tada) | [HuggingFace](https://huggingface.co/spaces/HumeAI/tada) | [Paper](https://arxiv.org/pdf/2602.23068v1)
- 💡 **MMC-Relevanz**: Könnte für NPC-Stimmen oder dynamisches Audio eingesetzt werden

### 🤖 Ai2 MolmoBot: Sim-Only Training, Zero-Shot Real-World
Allen AI hat **MolmoBot** + **MolmoSpaces** veröffentlicht — Robotik-Modelle die *ausschließlich* in Simulation trainiert wurden und direkt auf echten Robotern funktionieren. 230.000+ Indoor-Szenen, 42M+ physikbasierte Annotationen. Zero-Shot Sim-to-Real Transfer.
- 📎 [MolmoBot Paper](https://allenai.org/papers/molmobot) | [Blog](https://allenai.org/blog/molmobot-robot-manipulation)
- 💡 **Relevanz**: Sim-Training-Ansatz direkt übertragbar auf AI-generierte Game-Behaviors

### 🧠 Tree Search Distillation für LLMs (PPO)
HackerNews-Top: Neue Technik kombiniert Tree Search mit Distillation via PPO für besseres LLM-Reasoning. Interessant für Agent-Systeme die komplexe Entscheidungen treffen müssen.
- 📎 [Blog Post](https://ayushtambde.com/blog/tree-search-distillation-for-language-models-using-ppo/)

### 🏢 Meta: Bis zu 16.000 Stellen gestrichen — AI als Effizienz-Treiber
Meta plant Abbau von bis zu **20% der Belegschaft** (~16.000 von 79.000). Hauptmotiv: AI-Infrastruktur-Kosten ausgleichen + AI-generierte Effizienzgewinne. Ähnliche Cuts bei Amazon und Block.
- 📎 [Reuters](https://www.reuters.com/business/world-at-work/meta-planning-sweeping-layoffs-ai-costs-mount-2026-03-14/)

### 🧪 Mirendil: Ex-Anthropic Neo-Lab, $175M @ $1B Valuation
Zwei Ex-Anthropic-Forscher gründen Mirendil für AI-beschleunigte Wissenschaft (Biologie, Materialwissenschaft). A16z + Kleiner Perkins co-leaden die Runde. Wächst der Neo-Lab-Trend weiter.

Anthropic launcht offizielles Partner-Netzwerk für Claude-Integration. HN-Diskussion zeigt breites Interesse aus Enterprise.
