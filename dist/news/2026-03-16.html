## 🤖 AI / LLM / Agenten-Systeme

### OpenClaw-RL: Training durch Gespräche (Princeton)
Neues Framework von Princeton, das jeden Chat-Reply und Terminal-Command automatisch in Trainings-Signal umwandelt. "Einfach reden = Modell verbessern" — schon nach ein paar Dutzend Interaktionen messbare Verbesserungen. Direkter Beweis: Agentic Engineering skaliert durch Nutzung.
→ https://the-decoder.com/

### "Was ist Agentic Engineering?" — Simon Willison
Ausführlicher Leitfaden auf HN-Frontpage zu Patterns für autonome Agenten-Systeme. Wichtige Lektüre für alle, die AI-First Workflows bauen.
→ https://simonwillison.net/guides/agentic-engineering-patterns/what-is-agentic-engineering/

### China AI-Agenten-Wahn: Städte zahlen bis zu 1,4 Mio. USD
Mindestens 7 chinesische Städte (Shenzhen, Hefei, Wuxi u.a.) bieten massive Subventionen für "Ein-Personen-Firmen mit AI-Agenten als Mitarbeiter". Exakt das Modell, das Druid & PRISM gerade leben.
→ https://the-decoder.com/

Begründung: steigende AI-Infrastrukturkosten + "AI-assisted work". Zuckerberg will 600 Mrd. USD bis 2028 in AI investieren.
→ https://the-decoder.com/
