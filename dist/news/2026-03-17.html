## 🤖 AI / LLM / Agenten-Systeme

### Mistral veröffentlicht Leanstral — Open-Source Coding Agent mit formaler Verifikation
Mistral hat **Leanstral** released — einen Open-Source Coding-Agenten für Lean 4 (Proof Assistant). Besonderheit: Der Agent verifiziert seinen generierten Code formal, statt nur auf Human-Review zu warten. Mit nur 120B-A6B (6B aktive Parameter) schlägt er Claude Sonnet 4.6 auf mathematischen Proof-Benchmarks.
- **MCP-Support:** Leanstral unterstützt beliebige MCPs via Mistral "vibe", optimiert für \`lean-lsp-mcp\`
- Lizenz: Apache 2.0 — kostenloser API-Endpoint verfügbar
- **Relevanz für MMC:** Zeigt Richtung von Coding-Agenten mit eingebautem Verifikations-Layer
- 🔗 https://mistral.ai/news/leanstral

### OpenAI: Bigger Problem als Modelle — Enterprise-Integration
OpenAI kämpft weniger mit Modell-Entwicklung, sondern damit, Firmen die KI tatsächlich in Workflows zu integrieren. Neues Joint Venture ($10B) und dedizierter Deployment-Arm gestartet.
- 🔗 https://the-decoder.com/

### Alibaba "Token Hub" — Qwen-Umbau für Enterprise-Agenten
Alibaba baut KI-Sparte um in "Alibaba Token Hub" (ATH) unter CEO Eddie Wu. Qwen-Team, DingTalk, Quark-Geräte + Consumer-Apps unter einem Dach. Enterprise-Agent auf Qwen-Basis angekündigt (Taobao/Alipay-Integration geplant).
- 🔗 https://the-decoder.com/

### Meta × Nebius: $27 Milliarden Cloud-Deal
Meta hat einen 5-Jahres-Vertrag mit Niederlande-Cloud Nebius abgeschlossen — inkl. erste Vera Rubin (Nvidia-Chips) Großinstallationen. KI-Infrastruktur-Rennen läuft auf Hochtouren.

### China-Chips: Hua Hong auf 7nm-Kurs
Hua Hong Group (China's 2. größter Chip-Hersteller) entwickelt 7nm-Produktionstechnik — mit Huawei-Kollaboration. Bald zweiter chinesischer Hersteller nach SMIC.
