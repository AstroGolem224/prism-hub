## 🤖 AI / LLM / Agenten-Systeme

### Claude 1M Context jetzt kostenlos
Anthropic hat den **1M Token Context Window** für Claude Opus 4.6 und Sonnet 4.6 ohne Aufpreis freigeschalten. Bisher kostete alles über 200k Tokens bis zu **100% Aufschlag** — das entfällt jetzt. Zusätzlich: Medien-Limit von 100 auf **600 Bilder/PDFs pro Request** erhöht. Opus 4.6 bleibt bei $5/$25 per Mio. Tokens, Sonnet 4.6 bei $3/$15.

> 💡 **Relevant für MMC:** Größere Codebases komplett im Context halten — kein Chunking mehr nötig!

🔗 [HackerNews Discussion (456 pts)](https://news.ycombinator.com/item?id=47367129) | [Anthropic Blog](https://claude.com/blog/1m-context-ga)
